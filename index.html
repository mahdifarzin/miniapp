<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست مینی آپ آپامد</title>
    <!-- ۱. کتابخانه رسمی تلگرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
            direction: rtl;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            text-align: right;
            background-color: var(--tg-theme-secondary-bg-color, #f9f9f9);
            word-break: break-word;
        }
        button {
            padding: 12px 20px;
            font-size: 15px;
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px 0;
            width: 100%;
            max-width: 320px;
        }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h2>تست مینی‌اپ Apamed</h2>
    <p id="user-display">در حال فراخوانی اطلاعات تلگرام...</p>

    <!-- دکمه‌ها برای تست -->
    <button onclick="testHealth()">۱. تست سلامت API (Health Check)</button><br>
    <button onclick="testDashboard()">۲. دریافت اطلاعات کاربر (Dashboard)</button>

    <div id="result" class="card" style="display:none;"></div>

    <script>
        // مقداردهی اولیه تلگرام
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // نمایش اطلاعات کاربر در بالای صفحه
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-display').innerText = 
                `سلام ${user.first_name} 👋 (شناسه: ${user.id})`;
        } else {
            document.getElementById('user-display').innerText = "⚠️ خارج از محیط تلگرام باز شده است.";
        }

        const BASE_URL = "https://api.apamed.ir";

        // ۱. تست Health Check
        function testHealth() {
            const resDiv = document.getElementById('result');
            resDiv.style.display = 'block';
            resDiv.innerHTML = "در حال ارسال درخواست به Health Check...";

            fetch(`${BASE_URL}/api/health`)
                .then(res => res.json())
                .then(data => {
                    resDiv.innerHTML = `<p class="success">✅ پاسخ سرور: ${JSON.stringify(data)}</p>`;
                })
                .catch(err => {
                    resDiv.innerHTML = `<p class="error">❌ خطا در ارتباط: ${err.message}</p>`;
                });
        }

        // ۲. تست دریافت اطلاعات داشبورد
        function testDashboard() {
            const resDiv = document.getElementById('result');
            resDiv.style.display = 'block';
            resDiv.innerHTML = "در حال اعتبارسنجی و گرفتن اطلاعات داشبورد...";

            fetch(`${BASE_URL}/api/dashboard`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Telegram-Init-Data': tg.initData 
                }
            })
            .then(async res => {
                const data = await res.json();
                if (!res.ok) {
                    // استخراج علت دقیق خطا از پاسخ پایتون
                    const detail = data.reason || data.message || data.error || `خطای سرور (کد ${res.status})`;
                    throw new Error(detail);
                }
                return data;
            })
            .then(data => {
                resDiv.innerHTML = `
                    <p class="success">✅ اطلاعات کاربر از دیتابیس دریافت شد:</p>
                    <b>نام کامل:</b> ${data.full_name || 'ثبت نشده'}<br>
                    <b>وضعیت AI:</b> ${data.ai_remaining_text}<br>
                    <b>وضعیت چالش:</b> ${data.challenge_remaining_text}<br>
                    <b>تعداد کل چالش‌ها:</b> ${data.challenge.total}
                `;
            })
            .catch(err => {
                resDiv.innerHTML = `<p class="error">❌ علت خطا: ${err.message}</p>`;
            });
        }
    </script>
</body>
</html>
